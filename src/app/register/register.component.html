<div class="login-container">
  <p class="login-header">Login To Rental Site</p>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
        <mat-form-field>
            <mat-label>Enter Username</mat-label>
            <input
            matInput
            formControlName="username"
            required
            />
        </mat-form-field>
    </div>

    <div class="form-group">
        <mat-form-field>
            <mat-label>Enter password</mat-label>
            <input matInput [type]="'password'" 
                    formControlName="password"
            />
        </mat-form-field>
    </div>

     <div class="form-group">
        <mat-form-field>
            <mat-label>Select</mat-label>
            <mat-select  formControlName="role"  (selectionChange)="doSomething($event)">
                <mat-option value="landlords">Landlords</mat-option>
                <mat-option value="property-managers">Property managers</mat-option>
                <mat-option value="renter">Renter</mat-option>

            </mat-select>
        </mat-form-field>
    </div>
    <button mat-raised-button type="submit" [disabled]="registerForm.invalid" class="btn btn-primary" >
      Register
    </button>
  </form>
</div>
