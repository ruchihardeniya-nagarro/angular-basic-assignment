<div class="home-page-layout">
    <div>
        <p class="home-page-header">All Available  Apartment</p>
    </div>

    <div class="apartment-container">
        <mat-card class="apartment-card" appearance="outlined">
        <mat-card-header>
            <mat-card-title>{{ latestAddedApartment.title }}</mat-card-title>
            <mat-card-subtitle>{{ latestAddedApartment.description }}</mat-card-subtitle>
        </mat-card-header>
        <app-image-slider [apartmentImages]="latestAddedApartment?.photos"></app-image-slider>
        <mat-card-actions>
            <button mat-button (click)="viewDetailClicked(latestAddedApartment?.id)">View Detail</button>
            <button mat-button>Add to Favorite</button>
        </mat-card-actions>
        </mat-card>
    </div>
    <div *ngFor="let apartment of getItemPairs(apartments)" class="apartment-list">
        <div class="row-layout">
            <div *ngFor="let item of apartment"class="apartment-layout">
                <mat-card class="apartment-card" appearance="outlined">
                    <img mat-card-image [src]="item.img">
                    <mat-card-header>
                        <mat-card-title>{{ item.title }}</mat-card-title>
                        <mat-card-subtitle>{{ item.description }}</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-actions>
                        <button mat-button (click)="viewDetailClicked(latestAddedApartment?.id)">View Detail</button>
                        <button mat-button (click)="markAsFavorite(latestAddedApartment)">Add to Favorite</button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
