<div class="home-page-layout">
    <div>
        <p class="home-page-header">All Available Apartment</p>
    </div>

    <div class="apartment-container">
        <mat-card class="apartment-card" appearance="outlined">
            <mat-card-header>
                <mat-card-title>{{ latestAddedApartment.title }}</mat-card-title>
                <mat-card-subtitle>{{ latestAddedApartment.description }}</mat-card-subtitle>
            </mat-card-header>
            <app-image-slider [apartmentImages]="latestAddedApartment?.photos"></app-image-slider>
            <mat-card-actions>
                <button mat-button (click)="viewDetailClicked(latestAddedApartment?.id)">View Detail</button>
                <button mat-button *ngIf="isLoggedIn&&!isApartmentAddedToFavorite(latestAddedApartment.id)" (click)="addToFavorites(latestAddedApartment?.id)">Add To
                    Favorite</button>
                <ng-container>
                    <button mat-button *ngIf="isLoggedIn&&isApartmentAddedToFavorite(latestAddedApartment.id)"
                        (click)="removeFromFav(latestAddedApartment?.id)">Remove from
                        Favorite
                    </button>
                </ng-container> </mat-card-actions>
        </mat-card>
    </div>
    <div *ngFor="let apartment of getItemPairs(apartments)" class="apartment-list">
        <div class="row-layout">
            <div *ngFor="let item of apartment" class="apartment-layout">
                <mat-card class="apartment-card" appearance="outlined">
                    <img mat-card-image [src]="item.img">
                    <mat-card-header>
                        <mat-card-title>{{ item.title }}</mat-card-title>
                        <mat-card-subtitle>{{ item.description }}</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-actions>
                        <!-- <button mat-button *ngIf="isLoggedIn&& !item.isFav" (click)="addToFavorites(item?.id)">Add To
                            Favorite</button>
                        <ng-container>
                            <button mat-button *ngIf="isLoggedIn&&item.isFav" (click)="removeFromFav(item?.id)">Remove from
                                Favorite
                            </button>
                        </ng-container> -->


                        <button mat-button *ngIf="isLoggedIn&&!isApartmentAddedToFavorite(item.id)"
                            (click)="addToFavorites(item?.id)">Add To Favorite</button>
                        <ng-container>
                            <button mat-button *ngIf="isLoggedIn&&isApartmentAddedToFavorite(item.id)"
                                (click)="removeFromFav(item?.id)">Remove from Favorite</button>
                        </ng-container>
                        <button mat-button (click)="viewDetailClicked(item?.id)">View Detail</button>

                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
